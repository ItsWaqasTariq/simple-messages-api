[project]
name = "simple-messages-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Waqas Tariq", email = "waqastariq0078@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
